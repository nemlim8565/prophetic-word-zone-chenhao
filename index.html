<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0D0F">
  <meta name="description" content="2026 年度團隊先知性領受 — 12 個關鍵字，邀請你靜下心一同加入禱告、查驗神在今年對整個區的心意。">
  <title>2026 年度領受 — 12 個關鍵字</title>
  <link rel="stylesheet" href="style.css?v=1.0.1">
  <!-- html2canvas (唯一允許的外部依賴) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body data-salt="c8a9" data-salted-password="9411319e78131c26005dff428549784cade4489ede0ae321d71923a5e2ae748f">

  <!-- ═══════════════════════════════════════════
       Layer 0 — 通關密碼
  ════════════════════════════════════════════ -->
  <section id="layer-0" class="layer active" role="main" aria-label="通關密碼">
    <div class="breath-glow" aria-hidden="true"></div>
    <div class="layer-0__card">
      <h1 class="layer-0__title">請輸入通關密碼</h1>
      <div class="layer-0__input-wrap" id="password-input-wrap">
        <input type="password" id="password-input" class="layer-0__input" placeholder="請輸入密碼" autocomplete="off"
          aria-label="通關密碼輸入框" autofocus>
      </div>
      <p class="layer-0__error" id="password-error" aria-live="polite">密碼錯誤，請重新輸入</p>
      <button id="btn-unlock" class="cta-button layer-0__btn" aria-label="確認密碼並進入">進入</button>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       Layer 1 — 集體查驗與呼召
  ════════════════════════════════════════════ -->
  <section id="layer-1" class="layer" role="main" aria-label="集體查驗與呼召">
    <div class="breath-glow" aria-hidden="true"></div>
    <div class="layer-1__content">
      <p class="layer-1__year">2026</p>
      <h1 class="layer-1__title">年度發展：12 個關鍵領受</h1>
      <p class="layer-1__body">
        這是屬於整個團隊的季節性領受。<br>
        邀請你靜下心，一同加入禱告、查驗神在今年對整個區的心意。
      </p>
      <button id="btn-enter" class="cta-button" aria-label="進入12個關鍵領受">我要加入</button>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       Layer 2 — 核心領受矩陣
  ════════════════════════════════════════════ -->
  <section id="layer-2" class="layer" role="main" aria-label="核心領受矩陣">
    <div class="layer-2__header">
      <button id="btn-home" class="home-btn" aria-label="回到首頁">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z" />
          <polyline points="9 21 9 12 15 12 15 21" />
        </svg>
      </button>
      <h2>12 個關鍵領受</h2>
    </div>
    <div class="keyword-grid" role="list" aria-label="關鍵字列表">
      <!-- 由 main.js 動態渲染 -->
    </div>
    <div class="layer-2__footer">
      <a id="btn-share" href="https://www.google.com/" target="_blank" rel="noopener noreferrer" class="share-btn"
        aria-label="我要分享">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3" />
          <circle cx="6" cy="12" r="3" />
          <circle cx="18" cy="19" r="3" />
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
        </svg>
        我要分享
      </a>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       Layer 3 — 同工領受與內容
  ════════════════════════════════════════════ -->
  <section id="layer-3" class="layer" role="main" aria-label="關鍵字詳細領受">
    <div id="layer-3__capture-zone">
      <header class="revelation-header">
        <span class="revelation-id"></span>
        <h2 class="revelation-keyword"></h2>
        <p class="revelation-subtitle"></p>
      </header>
      <div class="revelation-content" aria-live="polite">
        <!-- 由 main.js 動態渲染 ContentBlock[] -->
      </div>
      <footer class="revelation-footer">
        <small class="revelation-meta">2026 年度領受</small>
      </footer>
    </div>

    <div class="layer-3__actions">
      <button id="btn-back" class="action-btn" aria-label="返回關鍵字列表">返回</button>
      <button id="btn-question" class="action-btn action-btn--primary" aria-label="信仰反思與討論">信仰反思與討論</button>
      <button id="btn-screenshot" class="action-btn action-btn--screenshot" aria-label="截圖存檔為PNG">截圖</button>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       Modal — 信仰反思與討論
  ════════════════════════════════════════════ -->
  <div id="question-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-card">
      <header class="modal-header">
        <h3 id="modal-title" class="modal-title">信仰反思與討論</h3>
        <button id="modal-close" class="modal-close" aria-label="關閉視窗">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </header>
      <div id="modal-questions" class="modal-questions"></div>
    </div>
  </div>

  <!-- 資料與邏輯 -->
  <script src="data.js?v=1.0.1"></script>
  <script src="main.js?v=1.0.1"></script>
</body>

</html>
